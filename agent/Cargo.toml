[package]
name = "printbridge-agent"
version = "1.0.0"
description = "PrintBridge desktop agent for local printing from web applications"
authors = ["PrintBridge Contributors"]
license = "MIT"
repository = "https://github.com/CenterfireDigital/PrintBridge"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri
tauri = { version = "1.6", features = ["system-tray"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

# HTTP client for downloads
reqwest = { version = "0.11", features = ["stream", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
lopdf = { version = "0.38", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.10"
url = "2.5"

# UUID for job IDs
uuid = { version = "1.7", features = ["v4", "serde"] }

# File system paths
dirs = "5.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Base64 encoding for chunked uploads
base64 = "0.21"

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Graphics_Printing",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
