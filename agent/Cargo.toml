[package]
name = "printbridge-agent"
version = "1.0.0"
description = "PrintBridge desktop agent for local printing from web applications"
authors = ["PrintBridge Contributors"]
license = "MIT"
repository = "https://github.com/CenterfireDigital/PrintBridge"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri
tauri = { version = "1.6", features = ["shell-open", "system-tray", "notification"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

# HTTP client for downloads
reqwest = { version = "0.11", features = ["stream", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID for job IDs
uuid = { version = "1.7", features = ["v4", "serde"] }

# File system paths
dirs = "5.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Graphics_Printing",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
