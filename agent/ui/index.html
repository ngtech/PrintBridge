<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintBridge Label Setup</title>
<link rel="stylesheet" href="setup.css">
<main>
  <h1>PrintBridge Label Setup</h1>
  <p id="status" role="status">Starting…</p>
  <p>Endpoint: <code id="endpoint"></code></p>
  <p>Edit the settings file, then restart PrintBridge:</p>
  <input id="settings" aria-label="Settings file path" readonly>
  <h2>Pair a browser</h2>
  <p>Reveal the code only for the matching trusted site. Codes expire when PrintBridge exits.</p>
  <label for="origins">Trusted origin</label>
  <select id="origins" autocomplete="off"></select>
  <button id="reveal" type="button" disabled>Reveal code</button>
  <input id="token" aria-label="Pairing code" autocomplete="off" spellcheck="false" readonly hidden>
</main>
<script src="setup.js" defer></script>
</html>
