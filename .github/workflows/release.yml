name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Build SDK
  # ==========================================================================
  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Run tests
        working-directory: sdk
        run: npm test

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/

  # ==========================================================================
  # Build Agent - Windows
  # ==========================================================================
  build-windows:
    name: Build Agent (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            agent/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('agent/Cargo.lock') }}

      - name: Run tests
        working-directory: agent
        run: cargo test --release --verbose

      - name: Build release
        working-directory: agent
        run: cargo build --release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: printbridge-windows-x64
          path: agent/target/release/printbridge-agent.exe

  # ==========================================================================
  # Build Agent - macOS
  # ==========================================================================
  build-macos:
    name: Build Agent (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            agent/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('agent/Cargo.lock') }}

      - name: Run tests
        working-directory: agent
        run: cargo test --release --verbose

      - name: Build release
        working-directory: agent
        run: cargo build --release --verbose

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: printbridge-macos-x64
          path: agent/target/release/printbridge-agent

  # ==========================================================================
  # Build Agent - Linux
  # ==========================================================================
  build-linux:
    name: Build Agent (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            agent/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('agent/Cargo.lock') }}

      - name: Run tests
        working-directory: agent
        run: cargo test --release --verbose

      - name: Build release
        working-directory: agent
        run: cargo build --release --verbose

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: printbridge-linux-x64
          path: agent/target/release/printbridge-agent

  # ==========================================================================
  # Create Release
  # ==========================================================================
  create-release:
    name: Create Release
    needs: [build-sdk, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          # SDK
          cp -r artifacts/sdk-dist release/sdk
          cd release && zip -r printbridge-sdk-${{ github.ref_name }}.zip sdk && cd ..

          # Windows
          if [ -f artifacts/printbridge-windows-x64/printbridge-agent.exe ]; then
            cp artifacts/printbridge-windows-x64/printbridge-agent.exe release/PrintBridge-${{ github.ref_name }}-windows-x64.exe
          fi

          # macOS
          if [ -f artifacts/printbridge-macos-x64/printbridge-agent ]; then
            cp artifacts/printbridge-macos-x64/printbridge-agent release/PrintBridge-${{ github.ref_name }}-macos-x64
            chmod +x release/PrintBridge-${{ github.ref_name }}-macos-x64
          fi

          # Linux
          if [ -f artifacts/printbridge-linux-x64/printbridge-agent ]; then
            cp artifacts/printbridge-linux-x64/printbridge-agent release/PrintBridge-${{ github.ref_name }}-linux-x64
            chmod +x release/PrintBridge-${{ github.ref_name }}-linux-x64
          fi

          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
